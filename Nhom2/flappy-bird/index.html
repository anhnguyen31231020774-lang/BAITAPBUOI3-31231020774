<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Bird — Advanced FE</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game-shell"><a class="back" href="../">← Trang dự án</a><header><p>JAVASCRIPT CANVAS GAME</p><h1>FLAPPY <span>GARDEN</span></h1></header>
<div class="game-frame"><canvas id="game" width="420" height="600" aria-label="Game Flappy Bird"></canvas><div class="overlay" id="overlay"><p class="eyebrow" id="overlay-kicker">READY?</p><h2 id="overlay-title">Sẵn sàng bay?</h2><p id="overlay-text">Nhấn phím ↓ để chim bay lên. Né các chướng ngại vật và đạt 50 điểm để chiến thắng.</p><button id="start-btn">BẮT ĐẦU CHƠI</button></div><div class="hud"><span id="level">LEVEL 1</span><span id="score">SCORE 0</span></div></div>
<div class="game-controls"><span><kbd>↓</kbd> Bay lên</span><span><kbd>P</kbd> Tạm dừng</span><span><kbd>R</kbd> Chơi lại</span></div><p class="hint">Mẹo: nhấn phím mũi tên xuống theo nhịp, đừng giữ phím quá lâu.</p></main><script src="game.js"></script></body></html>
